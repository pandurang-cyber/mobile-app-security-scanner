<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile App Security Scanner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px 15px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); max-width: 650px; margin: auto; border: 1px solid #334155; }
        h2 { color: #38bdf8; margin-bottom: 20px; font-size: 24px; text-align: center; }
        .upload-section { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input[type="file"] { flex: 1; padding: 10px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
        button { padding: 10px 20px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        .danger { color: #f87171; font-weight: bold; }
        .safe { color: #4ade80; font-weight: bold; }
        .result-box { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-top: 20px; }
        ul { margin-left: 20px; margin-top: 10px; }
        li { margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛡️ Mobile App Security Scanner</h2>
        <div class="upload-section">
            <input type="file" id="apkInput" accept=".apk">
            <button onclick="uploadAndScan()">Scan APK</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        async function uploadAndScan() {
            const input = document.getElementById('apkInput');
            const resultsDiv = document.getElementById('results');
            if (!input.files[0]) return alert("Please select an APK file to scan.");

            resultsDiv.innerHTML = "<div class='result-box'><p>⏳ Scanning APK, please wait...</p></div>";
            const formData = new FormData();
            formData.append('apk_file', input.files[0]);

            try {
                const res = await fetch('/scan', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<div class='result-box'><p class='danger'>❌ Error: ${data.error}</p></div>`;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="result-box">
                            <h3>🔍 Analysis Results</h3>
                            <p style="margin-top:8px;"><b>App Name:</b> ${data.app_name}</p>
                            <p><b>Package Name:</b> ${data.package_name}</p>
                            <p><b>Total Permissions:</b> ${data.total_permissions}</p>
                            <p><b>Obfuscation Status:</b> <span class="${data.obfuscation_analysis.is_obfuscated ? 'danger' : 'safe'}">${data.obfuscation_analysis.obfuscation_score}</span> (${data.obfuscation_analysis.details})</p>
                            
                            <h4 style="margin-top:15px; color:#f87171;">⚠️ Dangerous Permissions Found (${data.dangerous_permissions.length}):</h4>
                            <ul>
                                ${data.dangerous_permissions.length > 0 
                                    ? data.dangerous_permissions.map(p => `<li><b class="danger">${p.permission}</b>:${p.risk}</li>`).join('')
                                    : '<li class="safe">No high-risk permissions detected.</li>'}
                            </ul>
                        </div>
                    `;
                }
            } catch (err) {
                resultsDiv.innerHTML = `<div class='result-box'><p class='danger'>❌ Scan failed or request timed out.</p></div>`;
            }
        }
    </script>
</body>
</html>
